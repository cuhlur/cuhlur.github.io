<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Artists | CUHLUR</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Playfair+Display:ital,wght@0,700;1,700&display=swap');
        
        body { font-family: 'Inter', sans-serif; background-color: #0a0a0a; color: #ededed; }
        .serif { font-family: 'Playfair Display', serif; }
        .artist-card { background: linear-gradient(180deg, rgba(255,255,255,0.03) 0%, rgba(255,255,255,0) 100%); transition: all 0.3s ease; }
        .artist-card:hover { border-color: rgba(255,255,255,0.4); background: rgba(255,255,255,0.07); transform: translateY(-2px); }
        
        /* Custom scrollbar for a cleaner look */
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: #0a0a0a; }
        ::-webkit-scrollbar-thumb { background: #222; border-radius: 10px; }
    </style>

    <script async src="https://www.googletagmanager.com/gtag/js?id=G-LZD9DR8ZX5"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-LZD9DR8ZX5');
    </script>
</head>
<body class="p-6 md:p-16">

    <nav class="max-w-6xl mx-auto mb-12">
        <a href="/" class="text-xs tracking-[0.2em] uppercase text-gray-500 hover:text-white transition">← Back to Home</a>
    </nav>

    <header class="max-w-6xl mx-auto mb-16">
        <h1 class="text-5xl md:text-7xl serif italic font-bold tracking-tighter">Artists.</h1>
        <p class="mt-4 text-gray-500 uppercase tracking-widest text-xs">Curated Creators & Visionaries</p>
    </header>

    <main class="max-w-6xl mx-auto grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
        
        <script>
            const artists = [
                "Adam Sandler", "Alice in Chains", "Andy Warhol", "Audioslave", "Big Black Delta", 
                "Bob Dylan", "Brand New", "Chris Cornell", "Citizen Dick", "Cloud Control", 
                "Cymbals Eat Guitars", "Dave Chappelle", "Dave Foley", "Dennis Miller", 
                "Dylan & The Dead", "Eddie Vedder", "Geggy Tah", "Gorillaz", "Jim Carrey", 
                "John Lennon", "Jon Waters", "Luis Buñuel", "Manchester Orchestra", "Matt Groening", 
                "Matt Pinfield", "Mike Judge", "Misfits", "Mother Love Bone", "Nirvana", 
                "Patton Oswalt", "Paul McCartney", "Paul Westerberg", "Pearl Jam", "Phil Hartman", 
                "Prophets of Rage", "PUP", "RAC", "Rage Against the Machine", "Rick Ross", 
                "Ringo Starr", "RMR", "Roy Lichtenstein", "Scott Weiland", "Soundgarden", 
                "Stone Temple Pilots", "Temple of the Dog", "The Band", "The Beatles", 
                "The Rolling Stones", "The Wallflowers", "Van Morrison"
            ];

            // This script generates the cards automatically to keep your HTML file clean
            document.write(artists.map(artist => `
                <div class="artist-card border border-white/10 p-6 rounded-lg flex items-center justify-center text-center group">
                    <span class="text-lg md:text-xl serif group-hover:italic transition-all duration-300 cursor-default">
                        ${artist}
                    </span>
                </div>
            `).join(''));
        </script>

    </main>

    <footer class="max-w-6xl mx-auto mt-32 mb-12 border-t border-white/5 pt-8 text-[10px] text-gray-700 tracking-[0.2em] uppercase flex justify-between">
        <p>© 2026 CUHLUR</p>
        <p>Curated Archive</p>
    </footer>

</body>
</html>
