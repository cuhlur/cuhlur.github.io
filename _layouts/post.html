<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ page.title }} | {{ site.title }}</title>
    <!-- Link to your existing stylesheet here so your posts match your site design -->
    <link rel="stylesheet" href="/css/style.css"> 
</head>
<body>
    <main style="max-width: 800px; margin: 0 auto; padding: 20px;">
        <a href="/">← Back Home</a>
        <h1>{{ page.title }}</h1>
        <p style="color: gray;">Published on {{ page.date | date: "%B %d, %Y" }}</p>
        <hr>
        
        <!-- Jekyll will inject your Markdown content right here -->
        {{ content }} 
        
    </main>
</body>
</html>
